<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Fact Bingo</title>
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #d9d5c8;
    --accent: #2f5fd0; --good: #1f8a4c; --good-bg: #dff3e6; --bad: #c0392b; --bad-bg: #f9e1dd;
    --free: #fff3c4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c; --card: #20232b; --ink: #eceef2; --muted: #9aa1ae; --line: #343946;
      --accent: #7ea2ff; --good: #5fd08f; --good-bg: #173524; --bad: #ff8a7a; --bad-bg: #40201c;
      --free: #4a401a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 4px 0 2px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); padding: 10px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .big { font-size: 44px; font-weight: 700; line-height: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.me td { font-weight: 700; }
  .tag { display: inline-block; background: var(--good); color: #fff; border-radius: 999px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; margin-left: 6px; }
  .offline { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--bad);
    color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .offline[hidden] { display: none; }
  .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .teams { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 12px; }
  .teams button { text-align: left; }
  .teams b { display: block; }
  .topline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .banner { background: var(--good-bg); color: var(--good); border: 1px solid var(--good);
    border-radius: 12px; padding: 12px; text-align: center; font-weight: 700; font-size: 20px; margin: 12px 0; }
  .stats { display: flex; gap: 16px; font-size: 14px; color: var(--muted); margin-top: 8px; }
  .stats b { color: var(--ink); }
  .grid { display: grid; gap: 6px; margin-top: 12px; }
  .cell { aspect-ratio: 1; min-width: 0; padding: 6px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); display: flex; flex-direction: column;
    justify-content: space-between; text-align: left; overflow: hidden; }
  .cell .fact { font-size: 12px; line-height: 1.25; overflow: hidden; display: -webkit-box;
    -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow-wrap: anywhere; }
  .cell .who { font-size: 11px; font-weight: 600; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.correct { background: var(--good-bg); border-color: var(--good); }
  .cell.correct .who { color: var(--good); }
  .cell.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .cell.wrong .who { color: var(--bad); text-decoration: line-through; }
  .cell.free { background: var(--free); align-items: center; justify-content: center; font-weight: 700; cursor: default; }
  .grid.s3 .cell .fact { font-size: 15px; -webkit-line-clamp: 6; }
  .grid.s3 .cell .who { font-size: 14px; }
  @media (min-width: 560px) {
    .cell { padding: 8px; }
    .cell .fact { font-size: 14px; -webkit-line-clamp: 6; }
    .cell .who { font-size: 13px; }
    .grid.s3 .cell .fact { font-size: 18px; }
  }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
    align-items: flex-end; justify-content: center; }
  #modal[hidden] { display: none; }
  #sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 20px; }
  @media (min-width: 560px) { #modal { align-items: center; } #sheet { border-radius: 16px; } }
  #sheet .fact { font-size: 20px; font-weight: 600; margin: 0 0 16px; overflow-wrap: anywhere; }
  #sheet select { width: 100%; font: inherit; padding: 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #sheet .row button { flex: 1; }
  .verdict { font-weight: 700; font-size: 18px; }
  .verdict.correct { color: var(--good); }
  .verdict.wrong { color: var(--bad); }
  .error { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fun Fact Bingo</h1>
  <div id="app"><p class="muted">Loading…</p></div>
</div>
<div id="modal" hidden><div id="sheet"></div></div>
<div id="offline" class="offline" hidden>Reconnecting…</div>


<script>
// Backend URL. ?api=... overrides it (used for local testing).
var API = new URLSearchParams(location.search).get('api') ||
  'https://fun-fact-bingo.abwilf.workers.dev';
var POLL_MS = 4000;

var state = null;   // last response from /api/state
var team = 0;
var open = -1;      // square shown in the dialog
var busy = false;   // a check is in flight
var epoch = 0;      // bumped on local changes so stale poll results are dropped
var timer = null;

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  for (var k in attrs || {}) {
    var v = attrs[k];
    if (v === false || v == null) continue;
    if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n[k] = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
function remember(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, String(val));
  } catch (e) { return null; }
}

function api(path, body) {
  return fetch(API + path, body ? {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  } : { cache: 'no-store' }).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok) throw new Error(j && j.error || 'HTTP ' + r.status);
      return j;
    });
  });
}
function online(ok) { document.getElementById('offline').hidden = ok; }

function poll() {
  clearTimeout(timer);
  var at = epoch;
  api('/api/state?team=' + team)
    .then(function (s) { online(true); if (at === epoch) apply(s); })
    .catch(function () { online(false); })
    .then(schedule);
}
function schedule() { clearTimeout(timer); timer = setTimeout(poll, POLL_MS); }

function apply(s) {
  var first = !state;
  state = s;
  // Remember the team per game, so a new or reset game starts fresh.
  if (first && !team) {
    var saved = parseInt(remember('bingo:team:' + s.game), 10) || 0;
    if (saved && s.started) { team = saved; epoch++; poll(); return render(); }
  }
  if (team && (!s.started || !s.card)) { team = 0; open = -1; }
  render();
}

function setTeam(t) {
  team = t;
  open = -1;
  if (state) remember('bingo:team:' + state.game, t);
  epoch++;
  if (state) state.card = null;
  render();
  window.scrollTo(0, 0);
  poll();
}

function render() {
  var app = document.getElementById('app');
  var kids;
  if (!state) kids = [el('p', { class: 'muted', text: 'Loading…' })];
  else if (!state.started) kids = lobbyView();
  else if (!team) kids = pickerView().concat(scoreboardView());
  else if (!state.card) kids = [el('p', { class: 'muted', text: 'Loading your card…' })];
  else kids = cardView().concat(scoreboardView());
  app.replaceChildren.apply(app, kids.filter(Boolean));
  renderModal();
}

function lobbyView() {
  return [el('div', { class: 'panel' }, [
    el('p', { text: 'The game has not started yet.' }),
    state.formUrl ? el('p', {}, ['Not signed up? ', el('a', { href: state.formUrl, target: '_blank', text: 'Add your fun fact' }), '.']) : null,
    el('p', { class: 'small muted', text: 'Teams will appear here when the host starts the game. No need to refresh.' })
  ])];
}

function pickerView() {
  return [
    el('p', { text: 'Find your name and tap your team.' }),
    el('div', { class: 'teams' }, state.teams.map(function (t) {
      return el('button', { onclick: function () { setTeam(t.id); } }, [
        el('b', { text: 'Team ' + t.id }),
        el('span', { class: 'small muted', text: t.members.join(', ') })
      ]);
    }))
  ];
}

function myStats() {
  for (var i = 0; i < state.scoreboard.length; i++) if (state.scoreboard[i].team === team) return state.scoreboard[i];
  return null;
}

function cardView() {
  var card = state.card;
  var stats = myStats() || { correct: 0, checked: 0, squares: 0, bingoAt: 0 };
  var members = (state.teams[team - 1] || { members: [] }).members;
  return [
    el('div', { class: 'topline' }, [
      el('div', {}, [el('b', { text: 'Team ' + team }), el('span', { class: 'muted small', text: '  ' + members.join(', ') })]),
      el('button', { class: 'link small', text: 'Not your team?', onclick: function () { setTeam(0); } })
    ]),
    stats.bingoAt ? el('div', { class: 'banner', text: 'BINGO! Shout it out!' }) : null,
    el('p', { class: 'small muted', text: 'Find the person behind each fact. Tap a square, pick a name, then check. ' +
      'Each square can only be checked once. Your teammates see the same card.' }),
    el('div', { class: 'stats' }, [
      el('span', {}, [el('b', { text: String(stats.correct) }), ' correct']),
      el('span', {}, [el('b', { text: String(stats.checked) }), ' / ' + stats.squares + ' checked'])
    ]),
    el('div', { class: 'grid s' + card.size, style: 'grid-template-columns: repeat(' + card.size + ', 1fr)' },
      card.cells.map(function (cell, i) {
        if (cell.free) return el('div', { class: 'cell free', text: 'FREE' });
        return el('button', { class: 'cell ' + (cell.result || ''), onclick: function () { open = i; renderModal(true); } }, [
          el('span', { class: 'fact', text: cell.fact }),
          el('span', { class: 'who', text: cell.pick ? (cell.result === 'correct' ? '✓ ' : '') + cell.pick : '' })
        ]);
      }))
  ];
}

function scoreboardView() {
  return [
    el('h2', { text: 'Scoreboard' }),
    el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: '#' }), el('th', { text: 'Team' }),
        el('th', { class: 'num', text: 'Correct' }), el('th', { class: 'num', text: 'Checked' })
      ])]),
      el('tbody', {}, state.scoreboard.map(function (s, i) {
        return el('tr', { class: s.team === team ? 'me' : null }, [
          el('td', { text: String(i + 1) }),
          el('td', {}, ['Team ' + s.team, s.bingoAt ? el('span', { class: 'tag', text: 'BINGO' }) : null]),
          el('td', { class: 'num', text: String(s.correct) }),
          el('td', { class: 'num', text: s.checked + ' / ' + s.squares })
        ]);
      }))
    ])
  ];
}

function closeModal() { open = -1; renderModal(); }

// force: rebuild even if the dialog for this square is already showing.
function renderModal(force) {
  var modal = document.getElementById('modal');
  var sheet = document.getElementById('sheet');
  var cell = state && state.card && open >= 0 ? state.card.cells[open] : null;
  if (!cell || cell.free) { modal.hidden = true; return; }
  // Don't yank the dropdown out from under someone using it during a background refresh.
  var sel = sheet.querySelector('select');
  if (!force && !modal.hidden && sel && sheet.dataset.sq === String(open) && !cell.result && !busy
      && (document.activeElement === sel || sel.value === (cell.pick || ''))) return;
  sheet.dataset.sq = String(open);
  var sq = open;
  var kids = [el('p', { class: 'fact', text: cell.fact })];
  if (cell.result) {
    kids.push(el('p', { class: 'verdict ' + cell.result,
      text: cell.result === 'correct' ? '✓ Correct, it is ' + cell.pick + '.' : '✗ Not ' + cell.pick + '. This square is locked.' }));
    kids.push(el('div', { class: 'row' }, [el('button', { text: 'Close', onclick: closeModal })]));
  } else {
    var checkBtn = el('button', { class: 'primary', disabled: busy || !cell.pick,
      text: busy ? 'Checking…' : 'Check (one try)', onclick: function () { check(sq, select.value); } });
    var select = el('select', { disabled: busy, onchange: function () {
      cell.pick = select.value;
      checkBtn.disabled = !select.value;
      epoch++;
      api('/api/pick', { team: team, sq: sq, pick: select.value }).catch(function () {});
      render();
    } }, [el('option', { value: '', text: 'Who is it?' })].concat(state.card.options.map(function (n) {
      return el('option', { value: n, text: n });
    })));
    select.value = cell.pick || '';
    kids.push(select);
    kids.push(el('div', { class: 'row' }, [el('button', { text: 'Close', onclick: closeModal }), checkBtn]));
  }
  sheet.replaceChildren.apply(sheet, kids);
  modal.hidden = false;
}

function check(sq, pick) {
  if (!pick) return;
  busy = true;
  epoch++;
  var at = epoch;
  clearTimeout(timer);
  renderModal(true);
  api('/api/check', { team: team, sq: sq, pick: pick })
    .then(function (s) { online(true); busy = false; if (at === epoch) apply(s); else render(); })
    .catch(function (e) { busy = false; render(); alert('Could not check: ' + e.message); })
    .then(function () { renderModal(true); schedule(); });
}

document.getElementById('modal').onclick = function (e) { if (e.target === this) closeModal(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
poll();
</script>
</body>
</html>
